<desc id="fenetre-description">SYSTÈME — ACTIVATION CRITIQUE Infiltration runique Aura runique a été activée de manière critique. Durée de l’effet supplémentaire 30 secondes Pendant l’effet, chaque coup porté avec l’arme imprégnée bénéficie d’un minimum de dégâts égal à la Puissance arcanique effective d’Hasol, sans réduction de ce minimum par la Défense adverse.</desc>
