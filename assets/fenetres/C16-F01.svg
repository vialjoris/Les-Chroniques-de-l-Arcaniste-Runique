<desc id="fenetre-description">SYSTÈME — ÉVOLUTION DE COMPÉTENCE Présage des failles Évolution : Cartographie des portails Permet de visualiser sur une carte magique les portails démoniaques détectés, leur emplacement et leur classification par couleur. Les futurs portails deviennent visibles pendant la fenêtre habituelle de prévision, environ dix heures avant leur manifestation. La carte se met à jour selon les apparitions perçues.</desc>
